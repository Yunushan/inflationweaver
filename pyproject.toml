[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inflationweaver"
version = "0.1.0"
description = "Source-aware inflation adjustment and real-return analytics"
readme = "README.md"
requires-python = ">=3.11"
license = "0BSD"
license-files = ["LICENSE"]
authors = [{name = "Yunus ÇOĞAL"}]
keywords = ["inflation", "real-return", "bist", "enag", "cpi", "tradingview"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business :: Financial"]
dependencies = [
  "polars>=1.34,<2",
  "duckdb>=1.4,<2",
  "fastapi>=0.120,<1",
  "httpx>=0.28,<1",
  "uvicorn>=0.38,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "build>=1.3,<2"]

[project.scripts]
inflationweaver = "inflationweaver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inflationweaver = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
